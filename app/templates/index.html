<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Accuracy AI Image Detector</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 500px; text-align: center; border: 1px solid #333; }
        .drop-zone { border: 2px dashed #444; border-radius: 8px; padding: 2rem; margin: 1.5rem 0; cursor: pointer; transition: 0.2s; }
        .drop-zone:hover { border-color: #007acc; background: #252526; }
        input[type="file"] { display: none; }
        button { background: #007acc; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        button:hover { background: #005999; }
        button:disabled { background: #444; cursor: not-allowed; }
        #resultsCard { margin-top: 1.5rem; display: none; text-align: left; background: #181818; padding: 1.25rem; border-radius: 8px; border: 1px solid #333; }
        .badge { display: inline-block; padding: 0.4rem 0.8rem; border-radius: 4px; font-weight: bold; margin-bottom: 0.75rem; font-size: 1rem; }
        .badge-real { background: #1b4332; color: #2dc653; border: 1px solid #2dc653; }
        .badge-ai { background: #4a0e17; color: #ff4d6d; border: 1px solid #ff4d6d; }
        .metric-row { display: flex; justify-content: space-between; margin: 0.4rem 0; font-size: 0.9rem; color: #ccc; }
        .metric-val { font-weight: bold; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <h2>AI vs Real Detector</h2>
        <p style="color: #888; font-size: 0.85rem;">Powered by ViT Deep Learning & Spectral Noise Analysis</p>
        <form id="uploadForm">
            <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <p id="label">Click or Drag & Drop Image Here</p>
                <input type="file" id="fileInput" name="file" accept="image/*" onchange="updateLabel()">
            </div>
            <button type="submit" id="submitBtn">Analyze Image</button>
        </form>

        <div id="resultsCard">
            <div id="badge" class="badge"></div>
            <div id="confidence" style="font-size: 1.1rem; font-weight: bold; margin-bottom: 1rem;"></div>
            <hr style="border: 0; border-top: 1px solid #333; margin: 0.75rem 0;">
            <div class="metric-row">
                <span>ViT Model Probability:</span>
                <span id="modelScore" class="metric-val"></span>
            </div>
            <div class="metric-row">
                <span>Spectral Noise Artifacts:</span>
                <span id="spectralScore" class="metric-val"></span>
            </div>
            <div class="metric-row">
                <span>Ensemble AI Score:</span>
                <span id="combinedScore" class="metric-val"></span>
            </div>
        </div>
    </div>

    <script>
        function updateLabel() {
            const input = document.getElementById('fileInput');
            if (input.files.length > 0) {
                document.getElementById('label').innerText = input.files[0].name;
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('fileInput');
            if (!input.files.length) return alert('Select an image first!');

            const btn = document.getElementById('submitBtn');
            btn.innerText = "Analyzing Neural Signals...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('file', input.files[0]);

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                
                const resultsCard = document.getElementById('resultsCard');
                const badge = document.getElementById('badge');
                const confidence = document.getElementById('confidence');

                resultsCard.style.display = 'block';
                badge.innerText = data.verdict;
                badge.className = data.verdict.includes("Real") ? "badge badge-real" : "badge badge-ai";
                confidence.innerText = `Confidence: ${data.confidence}`;

                document.getElementById('modelScore').innerText = data.breakdown.model_ai_probability;
                document.getElementById('spectralScore').innerText = data.breakdown.spectral_artifact_score;
                document.getElementById('combinedScore').innerText = data.breakdown.combined_ai_score;
            } catch (err) {
                alert("Error analyzing image.");
            } finally {
                btn.innerText = "Analyze Image";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
